<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 400px;
  height: 308px;
  overflow: hidden;
  background: #120e0a url("MenuBackground.png") center center / cover no-repeat;
  color: #f5eddb;
  font-family: "Segoe UI", sans-serif;
}
body { border: 3px solid #b88a3d; box-sizing: border-box; }
h1 {
  margin: 14px 0 0;
  color: #edc76b;
  font-size: 26px;
  letter-spacing: 5px;
  font-weight: 700;
  text-align: center;
}
.sub, .label {
  margin: 2px 0 0;
  color: #9e8a66;
  font-size: 11px;
  letter-spacing: 4px;
  text-align: center;
}
.label { margin-top: 12px; }
.rule { height: 2px; margin: 8px 18px 0; background: #b88a3d; }
.row { margin-top: 12px; text-align: center; }
.choice, .picked {
  display: inline-block;
  width: 64px;
  height: 64px;
  margin: 0 6px;
  box-sizing: border-box;
  background: #29211a;
  border: 1px solid #473824;
  color: #f5eddb;
  font-size: 20px;
  font-weight: 700;
  line-height: 62px;
  text-align: center;
  cursor: pointer;
}
.choice:hover { background: #47331a; border: 2px solid #edc76b; }
.picked, .picked:hover { background: #734d1a; border: 2px solid #edc76b; color: #edc76b; }
.start {
  display: block;
  width: 200px;
  height: 40px;
  margin: 14px auto 0;
  box-sizing: border-box;
  background: #38240f;
  border: 2px solid #b88a3d;
  color: #edc76b;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  line-height: 36px;
  text-align: center;
  cursor: pointer;
}
.start:hover { background: #664214; border-color: #edc76b; }
</style>
</head>
<body>
  <h1>BOWLING</h1>
  <div class="sub">TEN PIN</div>
  <div class="rule"></div>
  <div class="label">PLAYERS</div>
  <div class="row">
    <div class="{{P1}}" data-hook="menu.players1">1</div>
    <div class="{{P2}}" data-hook="menu.players2">2</div>
    <div class="{{P3}}" data-hook="menu.players3">3</div>
    <div class="{{P4}}" data-hook="menu.players4">4</div>
  </div>
  <div class="start" data-hook="menu.start">START</div>
</body>
</html>
