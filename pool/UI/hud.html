<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 360px;
  height: 72px;
  overflow: hidden;
  background: #12100e;
  color: #f4efe4;
  font-family: "Segoe UI", sans-serif;
}
.body { padding: 8px 12px; }
.title { color: #e7c56a; font-size: 12px; letter-spacing: 2px; }
.line { margin-top: 4px; font-size: 14px; }
</style>
</head>
<body>
  <div class="body">
    <div class="title">{{Title}}</div>
    <div class="line">{{Line}}</div>
  </div>
</body>
</html>
