<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 420px;
  height: 390px;
  overflow: hidden;
  background: #142018;
  color: #f4efe4;
  font-family: "Segoe UI", sans-serif;
}
body { border: 3px solid #c6a15b; box-sizing: border-box; }
h1 {
  margin: 18px 0 0;
  color: #e7c56a;
  font-size: 28px;
  letter-spacing: 6px;
  text-align: center;
}
.sub {
  margin: 4px 0 0;
  color: #8d9a86;
  font-size: 12px;
  letter-spacing: 2px;
  text-align: center;
}
.label {
  margin: 16px 0 6px;
  color: #c6a15b;
  font-size: 11px;
  letter-spacing: 3px;
  text-align: center;
}
.row { text-align: center; }
.choice {
  display: inline-block;
  min-width: 78px;
  height: 36px;
  margin: 0 4px;
  padding: 0 8px;
  box-sizing: border-box;
  background: #1c1814;
  border: 1px solid #4a3d2a;
  color: #f4efe4;
  font-size: 13px;
  font-weight: 700;
  line-height: 34px;
  text-align: center;
  cursor: pointer;
}
.choice:hover { border-color: #e7c56a; color: #ffe7a3; }
.start {
  display: block;
  width: 220px;
  height: 40px;
  margin: 18px auto 0;
  background: #241c12;
  border: 1px solid #c6a15b;
  color: #e7c56a;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 3px;
  line-height: 38px;
  text-align: center;
  cursor: pointer;
}
.keys {
  margin: 14px 24px 0;
  color: #8d9a86;
  font-size: 12px;
  line-height: 1.45;
  text-align: center;
}
</style>
</head>
<body>
  <h1>POOL</h1>
  <div class="sub">PASS AND PLAY</div>
  <div class="label">PLAYERS</div>
  <div class="row">
    <div class="choice" data-hook="menu.players1">1</div>
    <div class="choice" data-hook="menu.players2">2</div>
    <div class="choice" data-hook="menu.players3">3</div>
    <div class="choice" data-hook="menu.players4">4</div>
  </div>
  <div class="label">GAME</div>
  <div class="row">
    <div class="choice" data-hook="menu.eight">8-BALL</div>
    <div class="choice" data-hook="menu.nine">9-BALL</div>
    <div class="choice" data-hook="menu.cut">CUTTHROAT</div>
  </div>
  <div class="start" data-hook="menu.start">RACK</div>
  <div class="keys">Keys 1-4 choose players. E, N, C choose the game. Enter racks.</div>
</body>
</html>
